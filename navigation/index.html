<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#dfe4ec;--acc:#1f5fbf;--accbg:#e7effb;--ok:#1e7a4c;--okbg:#e3f4ea;--warn:#a05a00;--warnbg:#fdf0dc;--bad:#c0261a;--badbg:#fde8e6;--fs:15px}
body.night{--bg:#0b0b0b;--card:#141010;--ink:#ff8a7a;--mut:#b5574c;--line:#3a1f1c;--acc:#ff6b5b;--accbg:#2a1412;--ok:#ff8a7a;--okbg:#2a1412;--warn:#ffb08a;--warnbg:#2a1a12;--bad:#ff4d3d;--badbg:#331210}
body.easy{--fs:18px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs)}
#map{position:absolute;inset:0;bottom:var(--sheet,46vh);background:#aad3df}
body.night #map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.55) sepia(.6) saturate(2) hue-rotate(-20deg)}
.fab{position:absolute;z-index:500;display:flex;flex-direction:column;gap:8px}
.fab button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.fab button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#fabL{left:10px;top:calc(10px + env(safe-area-inset-top))}
#fabR{right:10px;top:calc(10px + env(safe-area-inset-top))}
#mob{background:#c0261a!important;color:#fff!important;border-color:#c0261a!important;font-size:12px!important}
#hud{position:absolute;z-index:500;left:66px;right:66px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:6px;justify-content:center;pointer-events:none}
#hud div{background:rgba(255,255,255,.92);color:#14213d;border-radius:10px;padding:4px 10px;text-align:center;min-width:64px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
body.night #hud div{background:rgba(20,10,10,.9);color:#ff8a7a}
#hud b{display:block;font-size:calc(var(--fs) + 7px);line-height:1.1}#hud small{font-size:11px;opacity:.75}
#sheet{position:absolute;left:0;right:0;bottom:0;height:var(--sheet,46vh);background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;z-index:600}
#grab{height:18px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none}#grab i{width:40px;height:4px;border-radius:9px;background:var(--line)}
#tabs{display:flex;gap:2px;padding:0 6px 6px;overflow-x:auto}
#tabs button{flex:1;border:0;background:transparent;color:var(--mut);font-size:12.5px;padding:7px 4px;border-radius:9px;white-space:nowrap}
#tabs button.on{background:var(--accbg);color:var(--acc);font-weight:600}
#panel{flex:1;overflow-y:auto;padding:4px 12px calc(14px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ins{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ins small{color:var(--mut);font-size:12px;display:block}.ins b{font-size:calc(var(--fs) + 9px);font-weight:600}.ins span{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
h3{font-size:13.5px;color:var(--mut);margin:14px 2px 6px;font-weight:600}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.red{background:var(--bad);border-color:var(--bad);color:#fff}
button.sm{font-size:12.5px;padding:5px 9px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.bar .sp{flex:1}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row .t{flex:1;min-width:0}.row small{color:var(--mut);font-size:12.5px;display:block}
label.c{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}label.c:first-child{border-top:0}label.c input{width:20px;height:20px}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--mut);font-size:13px}
.warnb{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.badb{background:var(--badbg);color:var(--bad);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 3px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500;font-size:12px}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px;gap:2px}.seg button{border:0;background:transparent;padding:5px 10px;font-size:13px}.seg button.on{background:var(--card)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:2000}.modal.on{display:flex}
.msheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.boat-ico{width:34px;height:34px}
.wp-ico{background:var(--acc);color:#fff;border-radius:50%;width:24px!important;height:24px!important;line-height:24px;text-align:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.cat-ico{position:relative}.cat-ico b{position:absolute;right:-6px;top:-6px;background:#c0261a;color:#fff;border-radius:9px;font:700 11px/16px Manrope,sans-serif;min-width:16px;padding:0 3px;text-align:center;border:1.5px solid #fff}.fl{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line)}.fl .n{flex:1;font-weight:600}.fl.has .n{color:var(--acc)}.fl button{width:36px;height:36px;border-radius:10px;font-size:20px;padding:0}.fl .q{min-width:26px;text-align:center;font-weight:800;font-size:17px}.flist{max-height:38vh;overflow:auto;margin:6px 0;border:1px solid var(--line);border-radius:12px;padding:0 8px}.warn{background:#fff3e0;color:#8a4b00;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.mk-ico{font-size:20px;line-height:26px;text-align:center;background:#fff;border-radius:50%;border:2px solid #16306b;width:30px!important;height:30px!important}
body.easy .mk-ico{width:40px!important;height:40px!important;font-size:26px;line-height:36px}
body.easy .wp-ico{width:32px!important;height:32px!important;line-height:32px;font-size:15px}
.wind{font-size:20px;color:#16306b;text-shadow:0 0 3px #fff;text-align:center;line-height:1}
.wind small{display:block;font-size:11px;font-weight:700;color:#16306b}
#scaleTxt{position:absolute;z-index:500;left:10px;bottom:calc(var(--sheet,46vh) + 26px);background:rgba(255,255,255,.85);color:#14213d;font-size:11px;padding:2px 6px;border-radius:6px}
svg.prof{width:100%;height:90px;background:var(--card);border:1px solid var(--line);border-radius:10px}

/* ===== habillage ===== */
:root{--bg:#eef2f7;--card:#fff;--ink:#0f1d3a;--mut:#5d6b82;--line:#e3e8f0;--acc:#1d5fd1;--accbg:#e8f0fd;--navy:#0f2a5c;--sea:#0e7c86;--ok:#15803d;--okbg:#e4f5ea;--warn:#b45309;--warnbg:#fdf1de;--bad:#c2261b;--badbg:#fde9e7;--sh:0 1px 2px rgba(15,29,58,.05),0 4px 14px rgba(15,29,58,.07);--glass:rgba(255,255,255,.82)}
@media (prefers-color-scheme:dark){:root{--bg:#0b111c;--card:#141c2b;--ink:#e9eef7;--mut:#97a3b8;--line:#243047;--acc:#7aa7ff;--accbg:#1a2a48;--ok:#5fd18e;--okbg:#122c1d;--warn:#f3b45c;--warnbg:#33240c;--bad:#ff8a7f;--badbg:#3a1714;--sh:none;--glass:rgba(20,28,43,.82)}}
body.night{--bg:#0b0606;--card:#160c0b;--ink:#ff8a7a;--mut:#c0665a;--line:#3a1f1c;--acc:#ff6b5b;--accbg:#2a1412;--navy:#3a0f0c;--sea:#5a1a14;--glass:rgba(22,12,11,.85)}
html,body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#map{background:#a9d3e6}
.fab button{width:48px;height:48px;border-radius:16px;border:0;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);font-size:15px;font-weight:800;box-shadow:0 4px 16px rgba(15,29,58,.18);display:flex;align-items:center;justify-content:center;transition:transform .1s}
.fab button:active{transform:scale(.93)}
#bCarnet{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;box-shadow:0 4px 16px rgba(109,40,217,.35)}#bCarnet svg{width:22px;height:22px}
.fab button svg{width:22px;height:22px}
.fab button.on{background:linear-gradient(135deg,var(--navy),var(--sea));color:#fff}
#mob{background:linear-gradient(135deg,#ef4444,#b91c1c)!important;font-size:12px!important;font-weight:800!important;letter-spacing:.04em}
#bRec.on{background:linear-gradient(135deg,#ef4444,#b91c1c)!important;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
#hud{gap:8px}
#hud div{background:linear-gradient(135deg,rgba(15,42,92,.92),rgba(14,124,134,.9));color:#fff;border-radius:16px;padding:6px 12px 5px;min-width:76px;box-shadow:0 6px 20px rgba(15,42,92,.3);backdrop-filter:blur(8px)}
body.night #hud div{background:rgba(40,10,8,.9);color:#ff8a7a}
#hud b{font-weight:800;letter-spacing:-.02em}#hud small{font-weight:600;opacity:.8;letter-spacing:.02em}
#scaleTxt{background:var(--glass);color:var(--ink);backdrop-filter:blur(8px);border-radius:8px;font-weight:600}
#sheet{border-top:0;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(15,29,58,.16);background:var(--bg)}
#grab{height:22px}#grab i{width:44px;height:5px;background:var(--mut);opacity:.35}
#tabs{gap:4px;padding:0 10px 8px}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:7px 2px 6px;border-radius:14px;color:var(--mut)}
#tabs button svg{width:20px;height:20px}
#tabs button.on{background:linear-gradient(135deg,var(--navy),var(--sea));color:#fff;font-weight:800}
#panel{padding:4px 14px calc(16px + env(safe-area-inset-bottom))}
.ins{border:0;border-radius:18px;padding:10px 12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.ins small{font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.ins b{font-weight:800;letter-spacing:-.02em}
.ins.hl{background:linear-gradient(135deg,var(--navy),var(--sea));color:#fff}.ins.hl small,.ins.hl span{color:rgba(255,255,255,.8)}
.card{border:0;border-radius:18px;box-shadow:var(--sh)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
button{font-weight:700;border-radius:14px;transition:transform .1s}button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--acc),#3b82f6);border-color:transparent;box-shadow:0 4px 12px rgba(29,95,209,.25)}
button.red{background:linear-gradient(135deg,#ef4444,#b91c1c);border-color:transparent;box-shadow:0 4px 12px rgba(194,38,27,.25)}
input,select,textarea{border-radius:12px;background:var(--card)}
.warnb,.badb{border-radius:14px;font-weight:600}
.seg{border-radius:12px;background:var(--line)}.seg button{border-radius:10px;font-weight:700}
.msheet{border-radius:24px 24px 0 0;background:var(--bg)}
.leaflet-control-attribution{font-size:9px!important;background:var(--glass)!important;border-radius:8px 0 0 0}
.leaflet-popup-content-wrapper{border-radius:14px;font-family:Manrope,system-ui,sans-serif}
.wp-ico{background:linear-gradient(135deg,var(--acc),#3b82f6)}

body.full #sheet{transform:translateY(110%);pointer-events:none}body.full #map{bottom:0!important}body.full #scaleTxt{bottom:34px}
#sheet{transition:transform .25s}
#bOrient span{display:inline-block;transition:transform .15s}
@media (orientation:landscape) and (max-height:620px){
 #map{bottom:0!important;right:min(380px,44vw)}
 #sheet{left:auto;top:0;height:auto!important;width:min(380px,44vw);border-radius:24px 0 0 24px!important;padding-top:env(safe-area-inset-top)}
 #grab{display:none}
 #scaleTxt{bottom:34px!important}
 #fabR{right:calc(min(380px,44vw) + 10px)}
 #hud{right:calc(min(380px,44vw) + 66px)}
 body.full #sheet{transform:translateX(110%)}body.full #map{right:0}body.full #fabR{right:10px}body.full #hud{right:66px}
}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.spc{display:flex;flex-direction:column;align-items:stretch;padding:0 0 6px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left}.spc b{padding:5px 7px 0;font-size:13px}.spc small{padding:0 7px;font-size:11px;color:var(--mut,#667)}
.spth,.spbig,.spmini{background:#dfe9f2 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6a7a8c}.spth{height:70px}.spbig{height:170px;border-radius:12px;background-color:#e4eef6}.spmini{width:46px;height:30px;border-radius:7px;flex:none}.spth svg,.spbig svg,.spmini svg{width:100%;height:100%}
.flinfo{padding:8px 4px 10px;border-bottom:1px solid var(--line);font-size:13px}.flinfo .spbig{height:130px}

#tideChip{position:absolute;z-index:500;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top));border:0;border-radius:14px;padding:6px 12px;font:700 13px/1.2 Manrope,system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,rgba(14,124,134,.94),rgba(15,42,92,.92));box-shadow:0 6px 18px rgba(15,42,92,.28);display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
#tideChip .tb{display:inline-block;width:8px;height:20px;border-radius:4px;background:rgba(255,255,255,.25);position:relative;overflow:hidden}#tideChip .tb i{position:absolute;left:0;right:0;bottom:0;background:#7fe3f0}
#tideChip small{font-weight:600;opacity:.85}
#tideChip .g{padding:1px 6px;border-radius:7px;font-size:11px}#tideChip .g.op{background:#16a34a}#tideChip .g.cl{background:#b91c1c}
.tdc svg{width:100%;height:auto;display:block}.tdtab{width:100%;border-collapse:collapse;font-size:14px}.tdtab td{padding:6px 4px;border-bottom:1px solid var(--line)}.tdtab .pm{font-weight:800}
.gate{border-radius:12px;padding:8px 10px;margin:6px 0;background:rgba(22,163,74,.12);border-left:4px solid #16a34a}.gate.no{background:rgba(185,28,28,.1);border-color:#b91c1c}.gate.unc{background:rgba(245,158,11,.14);border-color:#f59e0b}
body.full #tideChip{top:calc(66px + env(safe-area-inset-top))}
@media (orientation:landscape) and (max-height:620px){#tideChip{left:calc(50% - min(380px,44vw)/2)}body.full #tideChip{left:50%}}
</style>
</head>
<body>
<div id="map"></div>
<div id="hud"><div><b id="hSpd">–</b><small>nœuds</small></div><div><b id="hCog">–</b><small>cap °</small></div><div id="hNext" style="display:none"><b id="hDtw">–</b><small id="hBrg">mille</small></div></div>
<div class="fab" id="fabL"><button id="bFollow" title="Suivre ma position"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button><button id="bOrient" title="Orientation (touche pour remettre le nord)">N↑</button><button id="bFull" title="Carte plein écran" aria-label="Carte plein écran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><a id="bCarnet" href="https://stephane19691969.github.io/meetai/carnet/" target="_blank" rel="noopener" title="Carnet d'entretien" aria-label="Carnet d'entretien"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7"/><path d="M20 4v14h-7"/></svg></a><button id="bZin" style="font-size:22px">+</button><button id="bZout" style="font-size:22px">−</button></div>
<div class="fab" id="fabR"><button id="mob">MOB</button><button id="bMark" title="Marque ou photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></button><button id="bPeche" title="Noter ma pêche" aria-label="Noter ma pêche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c3-4.5 9-6 14-2l5-3-1.5 5 1.5 5-5-3c-5 4-11 2.5-14-2z"/><circle cx="6.5" cy="11.3" r=".9" fill="currentColor"/></svg></button><button id="bRec" title="Enregistrer la trace">●</button></div>
<div id="scaleTxt"></div>

const R_NM=3440.065,toR=d=>d*Math.PI/180,toD=r=>r*180/Math.PI;
function dist(a,b){const dLa=toR(b[0]-a[0]),dLo=toR(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLo/2)**2;return 2*R_NM*Math.asin(Math.min(1,Math.sqrt(h)));}
function brg(a,b){const y=Math.sin(toR(b[1]-a[1]))*Math.cos(toR(b[0]));const x=Math.cos(toR(a[0]))*Math.sin(toR(b[0]))-Math.sin(toR(a[0]))*Math.cos(toR(b[0]))*Math.cos(toR(b[1]-a[1]));return (toD(Math.atan2(y,x))+360)%360;}
function interp(a,b,f){return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}
const dm=(v,p,n)=>{const a=Math.abs(v),d=Math.floor(a),m=(a-d)*60;return `${d}°${m.toFixed(3).padStart(6,'0')}′${v>=0?p:n}`;};
const pos2=ll=>`${dm(ll[0],'N','S')} ${dm(ll[1],'E','W')}`;

/* ===== stockage photos/traces (IndexedDB) ===== */
const IDB={db:null,open(){return new Promise((ok,ko)=>{const r=indexedDB.open('navdb',2);r.onupgradeneeded=()=>{const d=r.result;['tracks','photos'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});if(!d.objectStoreNames.contains('cells'))d.createObjectStore('cells',{keyPath:'key'});};r.onsuccess=()=>{IDB.db=r.result;ok();};r.onerror=()=>ko(r.error);});},
 tx(s,m){return IDB.db.transaction(s,m).objectStore(s);},
 put(s,o){return new Promise((ok,ko)=>{const q=IDB.tx(s,'readwrite').put(o);q.onsuccess=()=>ok();q.onerror=()=>ko(q.error);});},
 get(s,k){return new Promise(ok=>{const q=IDB.tx(s,'readonly').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null);});},
 all(s){return new Promise(ok=>{const q=IDB.tx(s,'readonly').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ok([]);});},
 del(s,k){return new Promise(ok=>{const q=IDB.tx(s,'readwrite').delete(k);q.onsuccess=()=>ok();q.onerror=()=>ok();});}};

const ST=Object.assign({},DEF,LS.get('nav_st',{}));if(ST.couches&&ST.couches.peche===undefined)ST.couches.peche=true;ST.couches=Object.assign({},DEF.couches,ST.couches||{});if(ST.couches.balisageDet===undefined)ST.couches.balisageDet=true;if(ST.couches.delmar===undefined)ST.couches.delmar=true;if(ST.couches.litto===undefined)ST.couches.litto=true;if(ST.couches.ndf===undefined)ST.couches.ndf=false;if(!ST.couches.fond)ST.couches.fond=ST.couches.satellite?'sat':'osm';if(!ST.port)ST.port=DEF.port;if(!LS.get('nav_v3',false)){ST.center=ST.port.ll.slice();ST.zoom=13;LS.set('nav_v3',true);}if(!LS.get('nav_v2',false)){ST.couches.balisageDet=true;ST.couches.balisage=false;LS.set('nav_v2',true);}

/* ===== carte ===== */
const map=L.map('map',{zoomControl:false,attributionControl:true,rotate:!!L.Map.prototype.setBearing,touchRotate:!!L.Map.prototype.setBearing,rotateControl:false,bearing:0}).setView(ST.center,ST.zoom);

function buildLayers(){[base,sat,oceanL,ignL,orthoL,littoL,ndfL,seamark,depthL,reliefL,isoL,delmarL].forEach(l=>l&&map.removeLayer(l));

 delmarL=L.tileLayer('https://services.data.shom.fr/INSPIRE/wmts?service=WMTS&request=GetTile&version=1.0.0&layer=DELMAR_PYR_PNG_WLD_3857_WMTS&style=normal&tilematrixset=3857&format=image/png&tilematrix={z}&tilecol={x}&tilerow={y}',{maxZoom:18,maxNativeZoom:16,opacity:.85,attribution:'Délimitations maritimes © Shom (Licence Ouverte)'});

 ({osm:base,sat,ocean:oceanL,ign:ignL,ortho:orthoL}[ST.couches.fond]||base).addTo(map);if(ST.couches.relief)reliefL.addTo(map);if(ST.couches.ndf)ndfL.addTo(map);if(ST.couches.litto)littoL.addTo(map);if(ST.couches.profondeurs)depthL.addTo(map);if(ST.couches.isobathes)isoL.addTo(map);if(ST.couches.delmar)delmarL.addTo(map);if(ST.couches.balisage)seamark.addTo(map);}

const lyr={route:L.layerGroup().addTo(map),track:L.layerGroup().addTo(map),marks:L.layerGroup().addTo(map),replay:L.layerGroup().addTo(map),wind:L.layerGroup().addTo(map),shallow:L.layerGroup().addTo(map),mob:L.layerGroup().addTo(map)};

const SMFR={buoy_lateral:'Bouée latérale',beacon_lateral:'Balise latérale',buoy_cardinal:'Bouée cardinale',beacon_cardinal:'Balise cardinale',buoy_isolated_danger:'Bouée de danger isolé',beacon_isolated_danger:'Balise de danger isolé',buoy_safe_water:'Bouée d\'eaux saines',beacon_safe_water:'Balise d\'eaux saines',buoy_special_purpose:'Bouée spéciale',beacon_special_purpose:'Balise spéciale',buoy_installation:'Bouée d\'installation',light_major:'Phare',light_minor:'Feu',light_vessel:'Bateau-feu',landmark:'Amer',mooring:'Corps-mort / coffre',harbour:'Port',anchorage:'Zone de mouillage',rock:'Roche',wreck:'Épave',obstruction:'Obstruction',small_craft_facility:'Équipement plaisance',fog_signal:'Signal de brume',beacon_emergency_wreck:'Balise d\'épave récente',buoy_emergency_wreck:'Bouée d\'épave récente',daymark:'Marque de jour',platform:'Plateforme',pile:'Pieu',notice:'Panneau',restricted_area:'Zone réglementée',bridge:'Pont',lock_basin:'Écluse',signal_station_traffic:'Sémaphore',signal_station_warning:'Station de signaux',rescue_station:'Station de sauvetage',coastguard_station:'Garde-côtes'};
const CATFR={port:'bâbord',starboard:'tribord',preferred_channel_port:'chenal préféré à bâbord',preferred_channel_starboard:'chenal préféré à tribord',north:'Nord',east:'Est',south:'Sud',west:'Ouest'};
const COLFR={red:'rouge',green:'vert',yellow:'jaune',black:'noir',white:'blanc',blue:'bleu',orange:'orange'};
const TOPFR={'cylinder':'cylindre','cone, point up':'cône pointe en haut','cone, point down':'cône pointe en bas','2 cones up':'2 cônes pointes en haut','2 cones down':'2 cônes pointes en bas','2 cones base together':'2 cônes opposés par la base','2 cones point together':'2 cônes opposés par la pointe','2 spheres':'2 sphères','sphere':'sphère','x-shape':'croix en X','cross':'croix'};
function smTag(t,k){const ty=t['seamark:type'];return t[`seamark:${ty}:${k}`];}
function smInfer(t){const ty=t['seamark:type']||'';let col=(smTag(t,'colour')||'').split(';').filter(Boolean);let top=t['seamark:topmark:shape'];let tc=t['seamark:topmark:colour'];const cat=smTag(t,'category');
 if(/lateral/.test(ty)){if(!col.length)col=cat==='port'?['red']:cat==='starboard'?['green']:cat==='preferred_channel_port'?['green','red','green']:cat==='preferred_channel_starboard'?['red','green','red']:[];if(!top)top=/port/.test(cat||'')&&!/channel_port/.test(cat)?'cylinder':/starboard/.test(cat||'')&&!/channel_starboard/.test(cat)?'cone, point up':cat==='preferred_channel_port'?'cone, point up':cat==='preferred_channel_starboard'?'cylinder':null;if(!tc)tc=col[0];}
 if(/cardinal/.test(ty)){if(!col.length)col=cat==='north'?['black','yellow']:cat==='south'?['yellow','black']:cat==='east'?['black','yellow','black']:['yellow','black','yellow'];if(!top)top={north:'2 cones up',south:'2 cones down',east:'2 cones base together',west:'2 cones point together'}[cat];tc=tc||'black';}
 if(/isolated_danger/.test(ty)){if(!col.length)col=['black','red','black'];top=top||'2 spheres';tc=tc||'black';}
 if(/safe_water/.test(ty)){if(!col.length)col=['red','white'];top=top||'sphere';tc=tc||'red';}
 if(/special_purpose/.test(ty)){if(!col.length)col=['yellow'];top=top||'x-shape';tc=tc||'yellow';}
 if(/emergency_wreck/.test(ty)){if(!col.length)col=['blue','yellow'];top=top||'cross';tc=tc||'yellow';}
 return{col,top,tc:(tc||'black').split(';')[0],pat:smTag(t,'colour_pattern')||(/safe_water|emergency/.test(ty)?'vertical':'horizontal'),cat};}
function smLight(t){const out=[];const one=p=>{const ch=t[p+'character'];const c=t[p+'colour'];if(!ch&&!c)return;const g=t[p+'group'];const per=t[p+'period'];const r=t[p+'range'];
  const cc=(c||'').split(';').map(x=>({white:'W',red:'R',green:'G',yellow:'Y',blue:'Bu',orange:'Or'})[x]||'').join('');out.push(`${ch||''}${g?'('+g+')':''} ${cc}${per?' '+per+'s':''}${r?' '+r+'M':''}`.trim());};
 one('seamark:light:');for(let i=1;i<8;i++)one(`seamark:light:${i}:`);return [...new Set(out)];}
function smLightCol(t){const c=(t['seamark:light:colour']||t['seamark:light:1:colour']||'').split(';')[0];return SMC[c]||null;}
function smSvg(t){const ty=t['seamark:type']||'';const z=ST.easy?1.35:1;const lc=smLightCol(t);
 const flare=lc?`<path d="M20 12 C15 5 17 1 23 -2 C21 4 25 7 20 12Z" fill="#c026d3" opacity=".85"/><circle cx="20" cy="12" r="2.2" fill="${lc==='#ffffff'?'#fde047':lc}" stroke="#111" stroke-width=".5"/>`:'';
 if(/^(buoy_|beacon_)/.test(ty)){const I=smInfer(t);const beacon=/^beacon_/.test(ty);const cols=(I.col.length?I.col:['grey']).map(c=>SMC[c]||'#888');const id='m'+Math.random().toString(36).slice(2,7);
  const body=beacon?'M11 14 L15 14 L15 34 L11 34 Z':'M9 16 L17 16 L19 33 L7 33 Z';const y0=beacon?14:16,y1=beacon?34:33,x0=beacon?11:7,w0=beacon?4:12;let fill='';
  if(I.pat==='vertical'){const w=w0/cols.length;cols.forEach((c,i)=>fill+=`<rect x="${x0+i*w}" y="${y0}" width="${w+.2}" height="${y1-y0}" fill="${c}"/>`);}else{const h=(y1-y0)/cols.length;cols.forEach((c,i)=>fill+=`<rect x="${x0-2}" y="${y0+i*h}" width="${w0+4}" height="${h+.2}" fill="${c}"/>`);}
  const tc=SMC[I.tc]||'#111';const T={'cylinder':`<rect x="10" y="5" width="6" height="7" fill="${tc}" stroke="#111" stroke-width=".4"/>`,'cone, point up':`<path d="M13 3 L9.5 11 L16.5 11Z" fill="${tc}" stroke="#111" stroke-width=".4"/>`,'cone, point down':`<path d="M9.5 3 L16.5 3 L13 11Z" fill="${tc}" stroke="#111" stroke-width=".4"/>`,

   '2 spheres':`<circle cx="13" cy="3.5" r="3" fill="${tc}"/><circle cx="13" cy="10" r="3" fill="${tc}"/>`,'sphere':`<circle cx="13" cy="8" r="3.6" fill="${tc}"/>`,'x-shape':`<path d="M10 4 L16 12 M16 4 L10 12" stroke="${tc}" stroke-width="2.2"/>`,'cross':`<path d="M13 3 V13 M9 8 H17" stroke="${tc}" stroke-width="2.2"/>`};
  return `<svg width="${30*z}" height="${40*z}" viewBox="-2 -3 30 40"><clipPath id="${id}"><path d="${body}"/></clipPath><g clip-path="url(#${id})">${fill}</g><path d="${body}" fill="none" stroke="#111" stroke-width=".8"/><line x1="13" y1="12" x2="13" y2="${y0}" stroke="#111" stroke-width=".8"/>${T[I.top]||''}${beacon?'':'<path d="M4 34.5 Q13 31.5 22 34.5" fill="none" stroke="#2563eb" stroke-width="1.4"/>'}${flare}</svg>`;}
 if(/^light_|landmark|light_vessel/.test(ty))return `<svg width="${24*z}" height="${26*z}" viewBox="0 0 24 26"><path d="M12 18 C6 11 7 5 15 0 C13 7 17 11 12 18Z" fill="#c026d3"/><circle cx="12" cy="19" r="3.5" fill="${lc&&lc!=='#ffffff'?lc:'#fde047'}" stroke="#111" stroke-width="1"/>${/landmark/.test(ty)?'<path d="M7 25 L12 15 L17 25Z" fill="none" stroke="#111"/>':''}</svg>`;
 const G={mooring:`<circle cx="12" cy="12" r="5" fill="#f2c200" stroke="#111"/>`,harbour:`<circle cx="12" cy="12" r="9" fill="#fff" stroke="#c026d3" stroke-width="2"/><text x="12" y="16" font-size="11" font-weight="800" text-anchor="middle" fill="#c026d3">⚓</text>`,anchorage:`<text x="12" y="17" font-size="15" text-anchor="middle" fill="#c026d3">⚓</text>`,rock:`<text x="12" y="17" font-size="16" font-weight="800" text-anchor="middle" fill="#111">+</text>`,wreck:`<path d="M3 12 H21 M8 8 V16 M12 8 V16 M16 8 V16" stroke="#111" stroke-width="1.6"/>`,obstruction:`<circle cx="12" cy="12" r="7" fill="none" stroke="#111" stroke-dasharray="2 2"/><text x="12" y="15" font-size="8" text-anchor="middle">Obs</text>`};

function smPopup(t){const ty=t['seamark:type']||'';const I=smInfer(t);const name=t['seamark:name']||t.name||'';const L2=smLight(t);

async function routeWx(){const s=routeStats();const dep=ROUTE.depart?new Date(ROUTE.depart):new Date();toast('Chargement de la météo…');
 try{const P=ROUTE.pts;const lat=P.map(p=>p[0].toFixed(3)).join(','),lon=P.map(p=>p[1].toFixed(3)).join(',');
  const [w,m]=await Promise.all([fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn&timezone=auto&forecast_days=7`).then(r=>r.json()),fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height&timezone=auto&forecast_days=7`).then(r=>r.json()).catch(()=>null)]);
  const W=Array.isArray(w)?w:[w],Mr=m?(Array.isArray(m)?m:[m]):[];WXR=[];
  P.forEach((p,i)=>{const t=new Date(dep.getTime()+(i?s.legs[i-1].cum:0)/s.v*3600000);const hh=W[i].hourly;let k=hh.time.findIndex(x=>new Date(x)>=t);if(k<0){WXR[i]='hors prévision';return;}
   const wh=Mr[i]&&Mr[i].hourly&&Mr[i].hourly.wave_height?Mr[i].hourly.wave_height[k]:null;WXR[i]=`${arrow(hh.wind_direction_10m[k])} ${Math.round(hh.wind_speed_10m[k])} nd (raf. ${Math.round(hh.wind_gusts_10m[k])})${wh!=null?' · '+f1(wh)+' m':''}`;});renderRoute();}
 catch(e){toast('Météo indisponible (réseau).');}}
const arrow=d=>`<span style="display:inline-block;transform:rotate(${(d+180)%360}deg)">↑</span>`;
async function checkShallow(){toast('Contrôle des fonds en cours…');lyr.shallow.clearLayers();const S=[];

 const pts=S.length>80?S.filter((_,i)=>i%Math.ceil(S.length/80)===0):S;let min=Infinity,n=0,k=0,fail=0;const need=ST.tirant+ST.marge;

async function loadWx(ll){const [w,m]=await Promise.all([fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ll[0].toFixed(3)}&longitude=${ll[1].toFixed(3)}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m,weather_code&wind_speed_unit=kn&timezone=auto&forecast_days=3`).then(r=>r.json()),

const bf=k=>k<1?0:k<4?1:k<7?2:k<11?3:k<17?4:k<22?5:k<28?6:k<34?7:k<41?8:k<48?9:k<56?10:k<64?11:12;

 $('#wR').onclick=async()=>{WX=null;renderMeteo();};$('#wMap').onclick=windMap;
 (async()=>{try{if(!WX||Date.now()-WX.at>1800000||dist(WX.ll,ll)>3)await loadWx(ll);drawWx();}catch(e){$('#wBody').innerHTML='<div class="warnb">Météo indisponible : vérifie la connexion.</div>';}})();}
function drawWx(){const h=WX.w.hourly,m=WX.m&&WX.m.hourly;const now=Date.now();let i0=h.time.findIndex(t=>new Date(t).getTime()>=now-1800000);if(i0<0)i0=0;
 const cur=k=>({ws:h.wind_speed_10m[k],wd:h.wind_direction_10m[k],g:h.wind_gusts_10m[k],t:h.temperature_2m[k],wh:m?m.wave_height[k]:null,wp:m?m.wave_period[k]:null,cv:m&&m.ocean_current_velocity?m.ocean_current_velocity[k]:null,cd:m&&m.ocean_current_direction?m.ocean_current_direction[k]:null,sst:m&&m.sea_surface_temperature?m.sea_surface_temperature[k]:null});
 const c=cur(i0);const rows=[];for(let k=i0;k<Math.min(h.time.length,i0+36);k+=3){const x=cur(k);rows.push(`<tr><td>${new Date(h.time[k]).toLocaleString('fr-FR',{weekday:'short',hour:'2-digit'})}</td><td>${arrow(x.wd)} ${Math.round(x.ws)}</td><td>${Math.round(x.g)}</td><td>${x.wh!=null?f1(x.wh):'–'}</td><td>${x.cv!=null?f1(x.cv/1.852)+' '+arrow((x.cd+180)%360):'–'}</td></tr>`);}
 let tide='';if(m&&m.sea_level_height_msl&&m.sea_level_height_msl.some(v=>v!=null)){const N=Math.min(48,h.time.length-i0),vals=m.sea_level_height_msl.slice(i0,i0+N);const mn=Math.min(...vals),mx=Math.max(...vals);const X=k=>k/(N-1)*300,Y=v=>80-((v-mn)/(mx-mn||1))*70;
  let ext=[];for(let k=1;k<N-1;k++){if(vals[k]>vals[k-1]&&vals[k]>=vals[k+1])ext.push(['PM',k]);if(vals[k]<vals[k-1]&&vals[k]<=vals[k+1])ext.push(['BM',k]);}
  tide=`<h3>Marée calculée (48 h)</h3><svg class="prof" viewBox="0 0 300 90" preserveAspectRatio="none"><polyline fill="none" stroke="#1f5fbf" stroke-width="2" points="${vals.map((v,k)=>X(k)+','+Y(v)).join(' ')}"/>${ext.map(([t,k])=>`<text x="${X(k)}" y="${t==='PM'?Y(vals[k])-3:Y(vals[k])+10}" font-size="8" text-anchor="middle" fill="currentColor">${t} ${new Date(h.time[i0+k]).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</text>`).join('')}</svg><div class="muted">Hauteur modélisée par rapport au niveau moyen (${f1(mn)} à ${f1(mx)} m). Les heures de référence sont celles du SHOM (annuaire des marées).</div>`;}
 $('#wBody').innerHTML=`<div class="grid"><div class="ins"><small>Vent</small><b>${Math.round(c.ws)}</b> <span>nd ${arrow(c.wd)} · force ${bf(c.ws)}</span></div><div class="ins"><small>Rafales</small><b>${Math.round(c.g)}</b> <span>nd</span></div>
 <div class="ins"><small>Vagues</small><b>${c.wh!=null?f1(c.wh):'–'}</b> <span>m${c.wp?' · '+Math.round(c.wp)+' s':''}</span></div><div class="ins"><small>Courant</small><b>${c.cv!=null?f1(c.cv/1.852):'–'}</b> <span>nd ${c.cv!=null?'vers '+Math.round(c.cd)+'°':''}</span></div>
 <div class="ins"><small>Air</small><b>${Math.round(c.t)}°</b></div><div class="ins"><small>Mer</small><b>${c.sst!=null?Math.round(c.sst)+'°':'–'}</b></div></div>
 ${c.g>=25||c.ws>=20?'<div class="badb">Vent fort : au-delà de force 5-6, la sortie est déconseillée pour un open de 5 m.</div>':''}
 <h3>Prévisions (vent nd, rafales, vagues m, courant nd)</h3><div class="card"><table><tr><th>Heure</th><th>Vent</th><th>Raf.</th><th>Vagues</th><th>Courant</th></tr>${rows.join('')}</table></div>${tide}

function fillImgs(root){root.querySelectorAll('[data-spimg]').forEach(el=>{el.innerHTML=ILL(el.dataset.spimg);});return Promise.resolve();}
function spCard(n){const sp=SP[n];return `<div class="spbig" data-spimg="${esc(n)}"></div><div style="margin-top:8px"><b style="font-size:17px">${esc(n)}</b> <i class="muted">${esc(sp.l)}</i></div>
 <div style="margin-top:6px"><b>Reconnaître :</b> ${esc(sp.id)}</div><div style="margin-top:4px"><b>Taille minimale :</b> ${esc(sp.t)}</div>${sp.r?`<div class="warn" style="margin-top:6px">${esc(sp.r)}</div>`:''}
 <div style="margin-top:8px"><a class="sm" href="https://fr.wikipedia.org/w/index.php?search=${encodeURIComponent(sp.l)}" target="_blank" rel="noopener">📷 Voir de vraies photos (Wikipédia)</a></div><div class="muted" style="font-size:11px;margin-top:4px">Illustration simplifiée pour l'identification.</div>`;}
function credit(){}
function showSp(n){openModal(spCard(n)+`<div class="bar"><span class="sp"></span><button data-close>Fermer</button></div>`);const m=$('#msheet');fillImgs(m);credit(m);}
function guideEspeces(){openModal(`<h3>📖 Espèces de la baie de Saint-Brieuc</h3><input id="gF" placeholder="Rechercher…"><div id="gL"></div><p class="muted" style="font-size:12px">Tailles : pêche de loisir Manche–Atlantique (arrêté du 26 octobre 2012 modifié et règlements européens). La réglementation évolue : vérifie auprès de la DDTM ou des Affaires maritimes avant de garder une prise.</p>
 <div class="bar"><span class="sp"></span><button data-close>Fermer</button></div>`);
 const draw=()=>{const f=$('#gF').value.trim().toLowerCase();$('#gL').innerHTML=Object.entries(SPG).map(([g,lab])=>{const L2=Object.keys(SP).filter(n=>SP[n].g===g&&(!f||n.toLowerCase().includes(f)||SP[n].l.toLowerCase().includes(f)));return L2.length?`<h3 style="margin:10px 0 6px">${lab}</h3><div class="spgrid">${L2.map(n=>`<button class="spc" data-sp="${esc(n)}"><div class="spth" data-spimg="${esc(n)}"></div><b>${esc(n)}</b><small>${esc(SP[n].t)}</small></button>`).join('')}</div>`:'';}).join('');fillImgs($('#gL'));};
 $('#gF').oninput=draw;draw();$('#gL').onclick=e=>{const b=e.target.closest('[data-sp]');if(b)showSp(b.dataset.sp);};}

/* ---- Carnet de pêche ---- */
const FISH=[...Object.keys(SP),'Autre'];
const TECH=['Traîne','Mitraillette / plumes','Leurre','Appât en dérive','Pêche au fond','Casier','Palangre','Pêche à pied','Autre'];
let CATCH=LS.get('nav_peche',[]);lyr.peche=L.layerGroup().addTo(map);let PLACECATCH=false;
const catTot=c=>Object.values(c.esp||{}).reduce((a,b)=>a+(+b||0),0);
const catIcon=c=>L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:`<div class="cat-ico">${ICO_MAQ.replace(/#0b4f8a/g,'#c0261a').replace(/#7fb6d9/g,'#f6b26b')}<b>${catTot(c)}</b></div>`});
function drawCatch(){lyr.peche.clearLayers();CATCH.forEach(c=>L.marker(c.ll,{icon:catIcon(c),zIndexOffset:400}).addTo(lyr.peche).on('click',()=>showCatch(c.id)));}
function saveCatch(){LS.set('nav_peche',CATCH);drawCatch();if(TAB==='traces')renderTraces();}
function setPlaceCatch(on){PLACECATCH=on;$('#bPeche').classList.toggle('on',on);if(on)toast('Touche la carte à l\'endroit de ta pêche.');}
$('#bPeche').onclick=()=>{if(PLACECATCH){setPlaceCatch(false);return;}
 openModal(`<h3>🎣 Noter ma pêche</h3><p class="muted">Où as-tu pêché ?</p><div class="bar" style="flex-direction:column;align-items:stretch;gap:8px"><button class="pri" id="cTap">Toucher la carte pour placer le point</button><button id="cGps" ${G.pos?'':'disabled'}>Ma position GPS actuelle${G.pos?'':' (pas de signal)'}</button><button data-close>Annuler</button></div>`);
 $('#cTap').onclick=()=>{closeModal();setPlaceCatch(true);};$('#cGps').onclick=()=>{closeModal();catchForm(G.pos.slice());};};
const dtLocal=t=>{const d=new Date(t-new Date(t).getTimezoneOffset()*60000);return d.toISOString().slice(0,16);};
function catchForm(ll,id){const old=id?CATCH.find(x=>x.id===id):null;const Q=Object.assign({},old?old.esp:{});
 const extra=Object.keys(Q).filter(k=>!FISH.includes(k));const list=[...FISH.slice(0,-1),...extra,'Autre'];
 openModal(`<h3>${old?'Modifier la pêche':'🎣 Ma pêche'}</h3><div class="muted">${pos2(ll)}</div>
 <div class="two"><div><label class="f">Date et heure</label><input id="cD" type="datetime-local" value="${dtLocal(old?old.t:Date.now())}"></div><div><label class="f">Pêcheurs à bord</label><input id="cP" type="number" min="1" inputmode="numeric" value="${old?old.pers:1}"></div></div>

 <label class="f">Notes (appât, marée, météo…)</label><textarea id="cN">${old?esc(old.notes||''):''}</textarea>

/* ===== GPX ===== */
function trackGPX(t){return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Navigation Mael" xmlns="http://www.topografix.com/GPX/1/1" xmlns:cb="https://carnet-de-bord/1">
<metadata><name>${esc(t.nom)}</name><time>${new Date(t.debut).toISOString()}</time><extensions><cb:distance>${t.dist.toFixed(2)}</cb:distance><cb:carburant>${(t.fuel||0).toFixed(2)}</cb:carburant><cb:vmax>${(t.vmax||0).toFixed(1)}</cb:vmax></extensions></metadata>
<trk><name>${esc(t.nom)}</name><trkseg>
${t.pts.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date(p[2]).toISOString()}</time><extensions><cb:speed>${p[3]}</cb:speed></extensions></trkpt>`).join('\n')}
</trkseg></trk></gpx>`;}
function routeGPX(r){return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Navigation Mael" xmlns="http://www.topografix.com/GPX/1/1"><rte><name>${esc(r.nom||'Itinéraire')}</name>${r.pts.map((p,i)=>`<rtept lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}"><name>${i+1}</name></rtept>`).join('')}</rte></gpx>`;}
function parseGPX(txt,name){const x=new DOMParser().parseFromString(txt,'application/xml');const pts=[...x.getElementsByTagName('trkpt')].map(n=>{const t=n.getElementsByTagName('time')[0];return [+n.getAttribute('lat'),+n.getAttribute('lon'),t?Date.parse(t.textContent):0,0];});
 if(pts.length<2)throw 0;let d=0,vmax=0,fuel=0;for(let i=1;i<pts.length;i++){const s=dist([pts[i-1][0],pts[i-1][1]],[pts[i][0],pts[i][1]]);d+=s;const h=(pts[i][2]-pts[i-1][2])/3600000;if(h>0){pts[i][3]=+(s/h).toFixed(1);vmax=Math.max(vmax,pts[i][3]);fuel+=lph(pts[i][3])*h;}}
 return{id:'t'+Date.now(),nom:(x.getElementsByTagName('name')[0]||{}).textContent||name,debut:pts[0][2]||Date.now(),fin:pts[pts.length-1][2]||Date.now(),pts,dist:d,vmax,fuel};}
async function downloadGPX(txt,fn){const blob=new Blob([txt],{type:'application/gpx+xml'});const file=new File([blob],fn,{type:'application/gpx+xml'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:fn});return;}catch(e){if(e.name==='AbortError')return;}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}

const TIDE_K={z0:6.4389,c:[["SA",0.0410686,-0.01138,0.00963,"1"],["SSA",0.0821373,0.01823,0.02369,"1"],["MM",0.5443747,0.04551,0.01798,"1"],["MSF",1.0158958,-0.01483,0.03368,"-m"],["M2",28.9841042,3.00231,1.80584,"m"],["S2",30.0,-1.05723,-0.84255,"1"],["N2",28.4397295,-0.4206,0.47333,"m"],["K2",30.0821373,0.48877,-0.05644,"k2"],["K1",15.0410686,0.02488,0.09378,"k1"],["O1",13.9430356,-0.05761,-0.06453,"o1"],["P1",14.9589314,-0.00738,0.03144,"1"],["Q1",13.3986609,0.01772,-0.02037,"o1"],["M4",57.9682084,0.10053,-0.1037,"m2"],["MS4",58.9841042,-0.0613,-0.0135,"m"],["MN4",57.4238337,-0.01289,0.03,"m2"],["M6",86.9523127,0.03412,-0.15333,"m3"],["2MS6",87.9682084,-0.02991,0.0886,"m2"],["2N2",27.8953548,-0.0458,-0.03011,"m"],["NU2",28.5125831,0.0018,0.08459,"m"],["L2",29.5284789,0.04345,0.07523,"m"],["MU2",27.9682084,-0.14383,-0.24896,"m"],["LAM2",29.4556253,0.00085,0.05097,"m"],["2SM2",31.0158958,-0.09264,-0.01856,"-m"],["M3",43.4761563,-0.01435,0.01581,"m15"],["MK3",44.0251729,0.0013,0.0076,"mk1"],["S4",60.0,-0.00409,0.01829,"1"],["MSN6",87.4238337,-0.02076,0.01338,"m2"],["2MN6",86.407938,0.05685,-0.02812,"m3"],["M8",115.9364166,-0.02153,0.00921,"m4"],["MKS2",29.0662415,0.02047,-0.04538,"mk2"]]};
/* Prédiction de marée à Binic : constantes harmoniques ajustées sur l'annuaire (hauteurs / zéro hydrographique) */
const TEP=Date.UTC(2000,0,1);
function tNod(t){const T=(t-Date.UTC(1900,0,1))/864e5/36525;const N=((259.157-19328.186*T)%360)*Math.PI/180,c=Math.cos,s=Math.sin;
 const fM=1.0004-0.0373*c(N)+0.0002*c(2*N),uM=-2.14*s(N),fK1=1.006+0.115*c(N)-0.009*c(2*N),uK1=-8.86*s(N)+0.68*s(2*N),fO=1.0089+0.1871*c(N)-0.0147*c(2*N),uO=10.80*s(N)-1.34*s(2*N),fK2=1.0241+0.2863*c(N)+0.0083*c(2*N),uK2=-17.74*s(N)+0.68*s(2*N);
 return {'1':[1,0],m:[fM,uM],'-m':[fM,-uM],m2:[fM*fM,2*uM],m3:[fM**3,3*uM],m4:[fM**4,4*uM],m15:[fM**1.5,1.5*uM],k1:[fK1,uK1],o1:[fO,uO],k2:[fK2,uK2],mk1:[fM*fK1,uM+uK1],mk2:[fM*fK2,uM+uK2]};}
let _tn=null,_tnT=0;
function tideH(t){if(!_tn||Math.abs(t-_tnT)>864e5*10){_tn=tNod(t);_tnT=t;}const h=(t-TEP)/36e5;let z=TIDE_K.z0;
 for(const [k,w,a,b,n] of TIDE_K.c){const [f,u]=_tn[n];const ang=(w*h+u)*Math.PI/180;z+=f*(a*Math.cos(ang)+b*Math.sin(ang));}return z;}
function tideExt(t0,t1){const out=[],st=6e5;let p=tideH(t0-st),c=tideH(t0);
 for(let t=t0;t<=t1;t+=st){const n=tideH(t+st);if((c>p&&c>=n)||(c<p&&c<=n)){const den=p-2*c+n;const dt=den?0.5*(p-n)/den:0;const tt=t+dt*st;out.push({t:tt,h:tideH(tt),pm:c>p});}p=c;c=n;}return out;}
function tideCoef(h){return Math.max(20,Math.min(120,Math.round(17.48*h-107.2)));}
function tideCross(t0,t1,lvl,rising){const st=3e5;let a=tideH(t0);for(let t=t0+st;t<=t1;t+=st){const b=tideH(t);if(rising?(a<lvl&&b>=lvl):(a>lvl&&b<=lvl)){let lo=t-st,hi=t;for(let i=0;i<12;i++){const m=(lo+hi)/2;const v=tideH(m);if(rising?(v<lvl):(v>lvl))lo=m;else hi=m;}return (lo+hi)/2;}a=b;}return null;}
/* porte du bassin de Binic : ouverture à 8,80 m (montant), fermeture à 9,00 m (descendant) */
const BINIC_GATE={open:8.8,close:9.0};
function binicGate(pm){const o=tideCross(pm.t-6*36e5,pm.t,BINIC_GATE.open,true),c=tideCross(pm.t,pm.t+6*36e5,BINIC_GATE.close,false);
 if(pm.h<BINIC_GATE.open)return {no:true};if(pm.h<BINIC_GATE.close+0.05)return {uncertain:true,o,c};return {o,c};}

/* ===== Marées (Binic) ===== */
const thm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const mf=h=>h.toFixed(2).replace('.',',');
const midnight=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime();};
function tideNow(){const now=Date.now(),h=tideH(now),up=tideH(now+6e5)>h;const ex=tideExt(now-7*36e5,now+14*36e5);const nx=ex.find(e=>e.t>now),pv=[...ex].reverse().find(e=>e.t<=now);
 const nPM=ex.find(e=>e.t>now&&e.pm)||ex.find(e=>e.pm);const lastPM=[...ex].reverse().find(e=>e.pm&&e.t<=now);
 let gate=null;for(const p of ex.filter(e=>e.pm)){const g=binicGate(p);if(g.o&&g.c&&now>=g.o&&now<=g.c){gate={open:true,until:g.c};break;}}
 if(!gate){const fut=ex.filter(e=>e.pm&&e.t>now-3*36e5).map(p=>({p,g:binicGate(p)})).find(x=>x.g.o&&x.g.o>now);gate={open:false,next:fut&&fut.g.o};}
 return {now,h,up,nx,pv,nPM,lastPM,gate};}
function drawTideChip(){const el=$('#tideChip');if(!el)return;const T=tideNow();const pct=Math.max(0,Math.min(100,(T.h-0.5)/12*100));
 const g=T.gate.open?`<span class="g op">Porte ouverte → ${thm(T.gate.until)}</span>`:T.gate.next?`<span class="g cl">Porte ouvre ${thm(T.gate.next)}</span>`:'';
 el.innerHTML=`<span class="tb"><i style="height:${pct}%"></i></span><span>${mf(T.h)} m ${T.up?'↗':'↘'}</span><small>${T.nx?(T.nx.pm?'PM ':'BM ')+thm(T.nx.t):''}</small>${g}`;}
function tideCurve(d0,days){const t0=d0,t1=d0+days*864e5,W=340,H=150,P=24;const X=t=>P+(t-t0)/(t1-t0)*(W-P-6),Y=h=>H-18-(h/13)*(H-30);
 let path='';for(let t=t0;t<=t1;t+=9e5)path+=(path?'L':'M')+X(t).toFixed(1)+','+Y(tideH(t)).toFixed(1);
 const ex=tideExt(t0,t1);const now=Date.now();
 const grid=[0,3,6,9,12].map(h=>`<line x1="${P}" x2="${W-6}" y1="${Y(h)}" y2="${Y(h)}" stroke="var(--line)" stroke-width=".6"/><text x="${P-4}" y="${Y(h)+3}" font-size="8" text-anchor="end" fill="var(--mut)">${h}</text>`).join('');
 const hrs=[];for(let t=t0;t<=t1;t+=6*36e5)hrs.push(`<text x="${X(t)}" y="${H-4}" font-size="8" text-anchor="middle" fill="var(--mut)">${new Date(t).getHours()}h</text>`);
 const gates=ex.filter(e=>e.pm).map(p=>{const g=binicGate(p);return g.o&&g.c?`<rect x="${X(g.o)}" y="${Y(13)}" width="${Math.max(1,X(g.c)-X(g.o))}" height="${Y(0)-Y(13)}" fill="#16a34a" opacity=".12"/>`:'';}).join('');
 const lab=ex.map(e=>`<circle cx="${X(e.t)}" cy="${Y(e.h)}" r="2.6" fill="${e.pm?'#0e7c86':'#0f2a5c'}"/><text x="${X(e.t)}" y="${Y(e.h)+(e.pm?-6:12)}" font-size="8.5" font-weight="700" text-anchor="middle" fill="var(--ink)">${thm(e.t)}</text>`).join('');
 const nw=now>=t0&&now<=t1?`<line x1="${X(now)}" x2="${X(now)}" y1="${Y(13)}" y2="${Y(0)}" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="3 2"/><circle cx="${X(now)}" cy="${Y(tideH(now))}" r="4" fill="#ea580c" stroke="#fff" stroke-width="1.5"/>`:'';
 return `<svg viewBox="0 0 ${W} ${H}">${grid}${gates}<line x1="${P}" x2="${W-6}" y1="${Y(8.8)}" y2="${Y(8.8)}" stroke="#16a34a" stroke-width=".8" stroke-dasharray="4 3"/><text x="${W-8}" y="${Y(8.8)-3}" font-size="8" text-anchor="end" fill="#16a34a">porte 8,80 m</text><path d="${path}" fill="none" stroke="#0e7c86" stroke-width="2.2"/><path d="${path}L${X(t1)},${Y(0)}L${X(t0)},${Y(0)}Z" fill="#0e7c86" opacity=".08"/>${hrs.join('')}${lab}${nw}</svg>`;}
let TIDE_DAY=0;
function showTides(){const d0=midnight(Date.now())+TIDE_DAY*864e5;const d1=d0+864e5;const ex=tideExt(d0,d1);const T=tideNow();
 const dl=new Date(d0).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
 const pms=ex.filter(e=>e.pm);
 const gates=pms.map(p=>{const g=binicGate(p);if(g.no)return `<div class="gate no"><b>PM ${thm(p.t)} (${mf(p.h)} m)</b> : la porte ne s'ouvre pas, la mer n'atteint pas 8,80 m.</div>`;
  const txt=`Ouverture ≈ <b>${g.o?thm(g.o):'?'}</b> · fermeture ≈ <b>${g.c?thm(g.c):'?'}</b>`;return `<div class="gate ${g.uncertain?'unc':''}"><b>PM ${thm(p.t)}</b> · ${txt}${g.uncertain?'<br><small>Pleine mer à peine au-dessus du seuil : ouverture incertaine, appelle la capitainerie.</small>':''}</div>`;}).join('');
 const acc=ex.filter(e=>!e.pm).length?(()=>{const out=[];for(const p of pms){const bm1=tideExt(p.t-8*36e5,p.t).filter(e=>!e.pm).pop(),bm2=tideExt(p.t,p.t+8*36e5).find(e=>!e.pm);if(!bm1||!bm2)continue;const a=tideCross(bm1.t,p.t,(bm1.h+p.h)/2,true),b=tideCross(p.t,bm2.t,(bm2.h+p.h)/2,false);if(a&&b)out.push(`${thm(a)} → ${thm(b)}`);}return out.length?`<p style="margin:8px 0 0"><b>Avant-port (échouage)</b> : accessible à partir de la mi-marée, environ ${out.join(' et ')}.</p>`:'';})():'';
 openModal(`<h3>🌊 Marées à Binic</h3>${TIDE_DAY===0?`<div class="muted">Maintenant : <b>${mf(T.h)} m</b> ${T.up?'↗ montante':'↘ descendante'}</div>`:''}
 <div class="bar" style="margin:8px 0"><button class="sm" id="tdP">‹</button><b style="flex:1;text-align:center;text-transform:capitalize">${dl}</b><button class="sm" id="tdN">›</button></div>
 <div class="tdc">${tideCurve(d0,1)}</div>
 <table class="tdtab">${ex.map(e=>`<tr><td class="${e.pm?'pm':''}">${e.pm?'Pleine mer':'Basse mer'}</td><td><b>${thm(e.t)}</b></td><td>${mf(e.h)} m</td><td>${e.pm?'coef ≈ '+tideCoef(e.h):''}</td></tr>`).join('')}</table>
 <h3 style="margin-top:14px">🚪 Porte du bassin à flot</h3><p class="muted" style="margin:0 0 4px;font-size:13px">Ouverture à 8,80 m (marée montante), fermeture à 9,00 m (marée descendante). Bande verte sur la courbe.</p>${gates||'<div class="muted">Pas de pleine mer ce jour.</div>'}${acc}
 <p class="muted" style="font-size:11px;margin-top:10px">Calcul de l'appli à partir des constantes de marée de Binic (précision habituelle ± 15 min, ± 20 cm). Pression atmosphérique et vent peuvent décaler la porte d'environ 30 min. Pour une entrée serrée, vérifie l'annuaire officiel ou la capitainerie (VHF 9, 02 96 73 61 86). Hauteurs au-dessus du zéro des cartes.</p>
 <div class="bar"><span class="sp"></span><button data-close>Fermer</button></div>`);
 $('#tdP').onclick=()=>{TIDE_DAY--;showTides();};$('#tdN').onclick=()=>{TIDE_DAY++;showTides();};}
$('#tideChip').onclick=()=>{TIDE_DAY=0;showTides();};
